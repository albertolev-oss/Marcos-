# Separate desktops, processes and persistent profiles; no shared clinical state.
x-browser: &browser
  build: .
  shm_size: 1gb
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 5
x-env: &env
  ALLOW_CLINICAL_WRITES: "false"
  PORT: "8080"
  AGENTS_ENABLED: "${AGENTS_ENABLED:-false}"
  AGENTS_MODEL: "${AGENTS_MODEL:-gpt-6-astra}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
services:
  sihosp:
    <<: *browser
    ports: ["127.0.0.1:8082:8080"]
    environment:
      <<: *env
      BROWSER_MODE: sihosp
    volumes: ["sihosp-profile:/data/chromium"]
  pacs:
    <<: *browser
    ports: ["127.0.0.1:8083:8080"]
    environment:
      <<: *env
      BROWSER_MODE: pacs
    volumes: ["pacs-profile:/data/chromium"]
volumes:
  sihosp-profile:
  pacs-profile:
