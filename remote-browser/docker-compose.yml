services:
  remote-browser:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ALLOW_CLINICAL_WRITES: "false"
      PORT: "8080"
      AGENTS_ENABLED: "${AGENTS_ENABLED:-false}"
      AGENTS_MODEL: "${AGENTS_MODEL:-gpt-6-astra}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEMO_ORIGIN: "http://mock-sihosp:8081"
    volumes:
      - chromium-profile:/data/chromium
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  mock-sihosp:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/fixtures:/usr/share/nginx/html:ro
    expose: ["8081"]
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    configs:
      - source: mock_nginx
        target: /etc/nginx/nginx.conf
configs:
  mock_nginx:
    content: |
      events {}
      http { server { listen 8081; root /usr/share/nginx/html; index mock-sihosp.html; } }
volumes:
  chromium-profile:
