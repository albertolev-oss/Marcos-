<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b3b60"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon.svg"><link rel="stylesheet" href="/styles.css"><title>Agente Web Clínico</title></head><body>
<header><strong>Agente Web Clínico</strong><span id="status" class="offline">● Desconectado</span></header>
<main><section class="browser"><iframe id="viewer" title="Navegador Chromium remoto"></iframe><div id="manual">Control manual activo</div></section>
<section class="agent"><label for="instruction">Instrucción al agente</label><div class="prompt"><textarea id="instruction" rows="2" placeholder="Buscá al paciente ficticio con DNI 12345678, pero no modifiques nada"></textarea><button id="send">Ejecutar</button></div><p id="message">MVP en modo lectura. Las credenciales se ingresan sólo en el navegador remoto.</p><nav><button data-action="stop" class="danger">Detener</button><button data-action="continue">Continuar</button><button data-action="manual">Tomar control manual</button><button data-action="logout">Cerrar sesión</button></nav></section></main>
<dialog id="login"><form method="dialog"><h2>Acceso privado</h2><p>Ingresá el token de acceso del sistema. No es una credencial clínica.</p><input id="token" type="password" autocomplete="current-password"><button id="loginButton">Ingresar</button></form></dialog><script type="module" src="/app.js"></script></body></html>
