services:
  clinical-agent:
    build: .
    env_file: .env
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:6080:6080"]
    volumes: ["browser-profile:/data/chromium-profile"]
    restart: unless-stopped
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  browser-profile:
